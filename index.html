<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Aria — minimalist mobile song library, lyric classification, and setlist builder."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <title>Aria</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('aria.theme');
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var mode = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.colorScheme = dark ? 'dark' : 'only light';
          document.documentElement.style.backgroundColor = dark ? '#0b0c10' : '#ffffff';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0b0c10' : '#ffffff');
          var cs = document.querySelector('meta[name="color-scheme"]');
          if (cs) cs.setAttribute('content', dark ? 'dark' : 'only light');
        } catch (_e) {}
      })();
    </script>
    <script>
      (function () {
        /*
         * A standalone window has no address bar and no reload button. If the
         * shell paints but the app never mounts, the person holding the phone
         * has nothing to tap and no way to tell "slow" from "broken" — which is
         * exactly the report this guards: installed app won't open, website is
         * fine. So watch for the mount, and if it never comes, say so.
         */
        var TIMEOUT_MS = 20000;
        var guard = function () {
          var root = document.getElementById('root');
          if (!root) return;

          var settled = false;
          var timer = 0;
          var observer = null;

          var clearTimer = function () {
            if (timer) {
              clearTimeout(timer);
              timer = 0;
            }
          };
          var finish = function () {
            settled = true;
            clearTimer();
            if (observer) observer.disconnect();
          };
          var arm = function () {
            if (settled || timer) return;
            timer = setTimeout(function () {
              timer = 0;
              if (settled) return;
              if (root.firstElementChild) {
                finish();
                return;
              }
              // Launched in the background: don't fail an app nobody is looking at.
              if (document.visibilityState === 'hidden') {
                arm();
                return;
              }
              finish();
              root.innerHTML =
                '<div role="status" style="display:grid;gap:12px;justify-items:center;' +
                'place-content:center;min-height:100dvh;padding:32px;text-align:center;' +
                'background:var(--canvas,#f6f7f9);color:var(--ink,#111318);' +
                'font:400 16px/1.5 Inter,system-ui,-apple-system,sans-serif;">' +
                '<strong style="font-size:18px;">Aria didn\'t start</strong>' +
                '<p style="margin:0;max-width:34ch;color:var(--muted,#6e7482);">' +
                'The page loaded but the app didn\'t. This is usually a dropped ' +
                'connection or an update that needs one reload.</p>' +
                '<button type="button" onclick="location.reload()" style="margin-top:4px;' +
                'padding:12px 22px;border:0;border-radius:999px;background:var(--brand,#0f8a65);' +
                'color:var(--brand-ink,#fff);font:650 15px/1 Inter,system-ui,sans-serif;' +
                'cursor:pointer;">Try again</button>' +
                '</div>';
            }, TIMEOUT_MS);
          };

          if (root.firstElementChild) return;
          if (typeof MutationObserver === 'function') {
            observer = new MutationObserver(function () {
              if (root.firstElementChild) finish();
            });
            observer.observe(root, { childList: true });
          }
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible' && !settled && !root.firstElementChild) arm();
          });
          arm();
        };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', guard);
        } else {
          guard();
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
